[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgtr"
version = "0.2.0"
description = "Deterministic toolkit for replacing text inside images"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.23",
]

[project.scripts]
imgtr = "imgtr.imgtr:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imgtr*"]
